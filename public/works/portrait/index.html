  }

  // ---------- smoke ----------
  // Same construction as the drawn original: one closed, balloon-like outline that pinches to a neck at the ember,
  // with a grey band of changing width hugging the inside of the black line and bare paper in the middle.
  function smokeBlob(tip, dir, sd) {
    const R = mulberry(sd.seed), r = (a, b) => a + R() * (b - a);
    let best = null, bestScore = Infinity;
    for (let tries = 0; tries < 28; tries++) {
      const R0 = r(100, 185), el = r(1.3, 2.3), sx = 1 / Math.sqrt(el), sy = Math.sqrt(el);
      const bendA = (R() < .5 ? -1 : 1) * r(.35, .8) * R0 * sx, bendF = r(.6, 1.4), bendP = R() * TAU;
      const H = [];
      for (let k = 2; k <= 4; k++) H.push({ k, a: r(.05, .45) / (k - 1), p: R() * TAU });
      const f0 = th => 1 + H.reduce((s, h) => s + h.a * Math.sin(h.k * th + h.p), 0);
      let fmin = Infinity; for (let i = 0; i < 90; i++) fmin = Math.min(fmin, f0(i / 90 * TAU));
      const squash = fmin < .28 ? (1 - .28) / (1 - fmin) : 1;
      const f = th => 1 + (f0(th) - 1) * squash;
      const te = R() * TAU, gap = r(.14, .32), neck = r(.12, .22);
      let fnear = 0; for (let i = -6; i <= 6; i++) fnear = Math.max(fnear, f(te + i * .1));
      const dl = R0 * fnear * r(1.12, 1.4);
      const ang = rad(r(-200, 40));  // direction from the ember toward the middle of the smoke: mostly rising, like the original
      const lx = Math.cos(te) * dl * sx, ly = Math.sin(te) * dl * sy;
      const lt = [lx + bendA * Math.sin(bendF * Math.PI * ly / (R0 * sy) + bendP), ly];
      const rot = ang + Math.PI - Math.atan2(lt[1], lt[0]);
      const cr = Math.cos(rot), sr = Math.sin(rot);
      const T = (x, y) => { let X = x * sx, Y = y * sy; X += bendA * Math.sin(bendF * Math.PI * Y / (R0 * sy) + bendP); return [X * cr - Y * sr, X * sr + Y * cr]; };
      const tl = T(Math.cos(te) * dl, Math.sin(te) * dl), C = [tip[0] - tl[0], tip[1] - tl[1]];
      const N = 260, pts = [];
      for (let i = 0; i <= N; i++) {
        const u = i / N, th = te + gap + u * (TAU - 2 * gap), rr = R0 * f(th);
        let q = T(Math.cos(th) * rr, Math.sin(th) * rr); q = [C[0] + q[0], C[1] + q[1]];
        const e = Math.min(u, 1 - u) / neck, w = e >= 1 ? 0 : (1 - e) * (1 - e) * (3 - 2 * (1 - e)) ;
        pts.push([q[0] + (tip[0] - q[0]) * w, q[1] + (tip[1] - q[1]) * w]);
      }
      for (let pass = 0; pass < 3; pass++) for (let i = 1; i < N; i++) pts[i] = [(pts[i - 1][0] + 2 * pts[i][0] + pts[i + 1][0]) / 4, (pts[i - 1][1] + 2 * pts[i][1] + pts[i + 1][1]) / 4];
      // keep it on the sheet and mostly out from behind the face
      let score = R() * 8 - (tip[1] - C[1]) / 25;
      for (const p of pts) {
        if (p[0] < FR.x + 70 || p[0] > FR.x + FR.w - 70 || p[1] < FR.y + 70 || p[1] > FR.y + FR.h - 70) score += 12;
        if (inHead(p, .95)) score += 3;
      }
      if (inHead(C, 1.1)) score += 200;
      // never let the smoke loop around the face
      const inside = (q) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] > q[1]) !== (b[1] > q[1]) && q[0] < (b[0] - a[0]) * (q[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
      for (const q of [HC, PARTS.head.dome, PARTS.head.face, PARTS.eyes.eyeA.center, PARTS.eyes.eyeB.center]) if (inside(q)) score += 400;
      if (score < bestScore) { bestScore = score; best = pts; }
    }
    const w0 = r(4, 9), w1 = r(28, 44), k1 = 1 + Math.floor(R() * 3), ph = R() * TAU, k2 = 3 + Math.floor(R() * 3), ph2 = R() * TAU;
    const band = best.map((_, i) => { const s = i / (best.length - 1); return w0 + (w1 - w0) * (.5 + .35 * Math.sin(TAU * k1 * s + ph) + .15 * Math.sin(TAU * k2 * s + ph2)); });
    return { pts: best, band, tip, inkW: r(2.6, 3.4) };
  }
  function drawSmoke(ctx, sm, col, bg) {
    const { pts, band } = sm;
    const outline = () => { ctx.beginPath(); ctx.moveTo(sm.tip[0], sm.tip[1]); pts.forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath(); };
    ctx.save();
    outline(); ctx.fillStyle = bg; ctx.fill();
    outline(); ctx.clip();
    // grey band: a wide stroke along the outline, clipped so only its inside half shows
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < pts.length - 1; i++) {
      ctx.lineWidth = 2 * band[i];
      ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
    }
    ctx.restore();
    outline(); ctx.strokeStyle = INK; ctx.lineWidth = sm.inkW; ctx.lineJoin = 'round'; ctx.stroke();
  }

  // ---------- eyes ----------
  function lensTop(e) { let mn = 1e9, mx = -1e9; e.lens.forEach(p => { for (let i = 1; i < p.length; i += 2) { mn = Math.min(mn, p[i]); mx = Math.max(mx, p[i]); } }); return [mn, mx]; }
  function pupilAt(e, ang, reach) {
    const c = e.cand, cx = e.center[0], cy = e.center[1], dx = Math.cos(ang), dy = Math.sin(ang);
    let best = -1e9;
    for (let i = 0; i < c.length; i += 2) best = Math.max(best, (c[i] - cx) * dx + (c[i + 1] - cy) * dy);
    const tx = cx + dx * best * reach, ty = cy + dy * best * reach;
    let bi = 0, bd = 1e9;
    for (let i = 0; i < c.length; i += 2) { const d = (c[i] - tx) ** 2 + (c[i + 1] - ty) ** 2; if (d < bd) { bd = d; bi = i; } }
    return [c[bi], c[bi + 1]];
  }
  function drawEye(ctx, key, d) {
    const e = PARTS.eyes[key];
    fillPaths(ctx, e.lens, PAPER);
    ctx.save(); ctx.beginPath(); e.lens.forEach(p => pathTo(ctx, p, ID)); ctx.clip('evenodd');
    let px = e.pupil[0], py = e.pupil[1], pr = e.pupil[2];
    if (!d.orig) { [px, py] = pupilAt(e, key === 'eyeA' ? d.gaze.A : d.gaze.B, d.gaze.reach); pr *= d.gaze.size; }
    ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fillStyle = INK; ctx.fill();
    if (d.lid && (key === 'eyeA' || d.lid.both)) {
      const [t0, t1] = lensTop(e), ly = t0 + (t1 - t0) * d.lid.level, w = 200, tn = Math.tan(d.lid.tilt);
      const cx = e.center[0];
      ctx.beginPath(); ctx.moveTo(cx - w, ly - w * tn); ctx.quadraticCurveTo(cx, ly + 10, cx + w, ly + w * tn); ctx.lineTo(cx + w, t0 - 50); ctx.lineTo(cx - w, t0 - 50); ctx.closePath();
      ctx.fillStyle = d.col[e.host]; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx - w, ly - w * tn); ctx.quadraticCurveTo(cx, ly + 10, cx + w, ly + w * tn);
      ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.stroke();
    }
    ctx.restore();
  }

  function drawBrow(ctx, key, d) {
    const b = PARTS.brows[key], e = PARTS.eyes[b.eye];
    let cx = e.center[0] + b.off[0], cy = e.center[1] + b.off[1], ang = b.ang, len = 1;
    if (!d.orig) {
      const p = d.brows[key === 'browA' ? 'A' : 'B'], dist = Math.hypot(b.off[0], b.off[1]);
      const ux = b.off[0] / dist, uy = b.off[1] / dist;
      cx = e.center[0] + ux * dist * p.k - uy * p.shift; cy = e.center[1] + uy * dist * p.k + ux * p.shift;
      ang = b.ang + p.ang; len = p.len;
    }
    const tf = place(cx, cy, ang, len, 1);
    fillPaths(ctx, b.fill, d.col.accent, tf);
    fillPaths(ctx, b.ink, INK, tf);
  }

  function drawCig(ctx, d) {
    const c = PARTS.cig, k = d.orig ? 1 : d.cig.k;
    let dir = c.dir;
    if (!d.orig) { const a = Math.atan2(dir[1], dir[0]) + d.cig.turn; dir = [Math.cos(a), Math.sin(a)]; }
    const len = c.filterLen + (c.len - c.filterLen) * k, w = 15;
    const ang = Math.atan2(dir[1], dir[0]);
    ctx.save(); ctx.translate(c.start[0], c.start[1]); ctx.rotate(ang);
    const seg = (a, b, col) => { ctx.fillStyle = col; ctx.fillRect(a, -w / 2, b - a, w); };
    const fl = Math.min(c.filterLen, len - 12);
    seg(0, fl, d.col.filter); seg(fl, len - 7, '#fffdf8'); seg(len - 7, len, d.col.ember);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
    ctx.strokeRect(0, -w / 2, len, w);
    ctx.beginPath(); ctx.moveTo(fl, -w / 2); ctx.lineTo(fl, w / 2); ctx.moveTo(len - 7, -w / 2); ctx.lineTo(len - 7, w / 2); ctx.stroke();
    ctx.restore();
    return { tip: [c.start[0] + dir[0] * len, c.start[1] + dir[1] * len], dir };
  }
  function cigTip(d) {
    const c = PARTS.cig; let dir = c.dir;
    if (!d.orig) { const a = Math.atan2(dir[1], dir[0]) + d.cig.turn; dir = [Math.cos(a), Math.sin(a)]; }
    const len = c.filterLen + (c.len - c.filterLen) * (d.orig ? 1 : d.cig.k);
    return { tip: [c.start[0] + dir[0] * len, c.start[1] + dir[1] * len], dir };
  }

  // ---------- full portrait ----------
  function render(canvas, seed, pxWidth, opts = {}) {
    const ctx = canvas.getContext('2d');
    canvas.width = Math.round(pxWidth); canvas.height = Math.round(pxWidth * FR.h / FR.w);
    const k = canvas.width / FR.w;
    const d = design(seed);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const bg = opts.bg ? backdrop(seed, d.col) : PAPER;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(k, 0, 0, k, -FR.x * k, -FR.y * k);
    ctx.translate(HC[0], HC[1]); ctx.rotate(d.tilt); ctx.translate(-HC[0], -HC[1]);

    // smoke behind everything
    if (d.orig) {
      fillPaths(ctx, PARTS.smoke0.fill, d.col.smoke);
      fillPaths(ctx, PARTS.smoke0.ink, INK);
    } else {
      const t = cigTip(d);
      drawSmoke(ctx, smokeBlob(t.tip, t.dir, d.smoke), d.col.smoke, bg);
    }
    // hair spikes
    PARTS.hair.forEach((h, i) => {
      const pl = d.orig ? { x: h.c[0], y: h.c[1], ang: h.ang, s: 1 } : d.hair[i];
      const tf = place(pl.x, pl.y, pl.ang, pl.s);
      fillPaths(ctx, h.fill, d.col.hair, tf);
      fillPaths(ctx, h.ink, INK, tf);
    });
    // head
    PARTS.static.fills.forEach(f => fillPaths(ctx, f.p, d.col[f.role]));
    drawEye(ctx, 'eyeA', d); drawEye(ctx, 'eyeB', d);
    fillPaths(ctx, PARTS.static.ink, INK);
    drawBrow(ctx, 'browA', d); drawBrow(ctx, 'browB', d);
    drawCig(ctx, d);
  }

  // ---------- this page: one portrait, a new one on every visit ----------
  const params = new URLSearchParams(location.search);
  const asked = parseInt(params.get('seed') ?? '', 10);
  const seed = Number.isFinite(asked) && asked >= 0 ? asked : (crypto.getRandomValues(new Uint32Array(1))[0] || 1);
  const withBackdrop = params.get('bg') !== '0';
  const canvas = document.getElementById('c');
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.min(innerWidth, innerHeight * FR.w / FR.h);
    render(canvas, seed, Math.max(320, w * dpr), { bg: withBackdrop });
    canvas.style.width = w + 'px';
    canvas.style.height = (w * FR.h / FR.w) + 'px';
  }
  draw();
  addEventListener('resize', draw);
})();
</script>
</body>
</html>
