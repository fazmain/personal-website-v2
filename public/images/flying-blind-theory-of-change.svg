<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" role="img" aria-label="Theory of change: Collect, Analyze, Uptake, Impact. Uptake is the weakest link between data and impact." font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="toc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Uptake is the weakest link between data and impact</text>
  <text x="24" y="52" font-size="11.5" fill="#6b6b6b">Each step holds only if the assumption beneath it does</text>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <path d="M184 120H207" marker-end="url(#toc-arrow)"/>
    <path d="M368 120H391" marker-end="url(#toc-arrow)"/>
    <path d="M552 120H575" marker-end="url(#toc-arrow)"/>
  </g>
  <rect x="24" y="76" width="160" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <rect x="208" y="76" width="160" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <rect x="392" y="76" width="160" height="88" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="2"/>
  <rect x="576" y="76" width="160" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <g text-anchor="middle" fill="#1f1f1f">
    <text x="104" y="100" font-size="15" font-weight="600">Collect</text>
    <text x="104" y="122">Opt-in tracking</text>
    <text x="104" y="138">across programs</text>
    <text x="104" y="154">Non-admit follow-up</text>
    <text x="288" y="100" font-size="15" font-weight="600">Analyze</text>
    <text x="288" y="122">Where people stall</text>
    <text x="288" y="138">What works for whom</text>
    <text x="288" y="154">Why, via interviews</text>
    <text x="472" y="100" font-size="15" font-weight="600">Uptake</text>
    <text x="472" y="122">Programs adjust</text>
    <text x="472" y="138">Funders reallocate</text>
    <text x="472" y="154">Gaps get named</text>
    <text x="656" y="100" font-size="15" font-weight="600">Impact</text>
    <text x="656" y="122">More researchers</text>
    <text x="656" y="138">per mentor-hour</text>
    <text x="656" y="154">Fewer people lost</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#6b6b6b">
    <text x="104" y="192" font-weight="600">Assumes</text>
    <text x="104" y="210">People and programs</text>
    <text x="104" y="226">will share data</text>
    <text x="288" y="192" font-weight="600">Assumes</text>
    <text x="288" y="210">Signal survives</text>
    <text x="288" y="226">small, biased samples</text>
    <text x="656" y="192" font-weight="600">Assumes</text>
    <text x="656" y="210">Constraints are partly</text>
    <text x="656" y="226">informational</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1f1f1f">
    <text x="472" y="192" font-weight="600">Assumes</text>
    <text x="472" y="210">Decision-makers act</text>
    <text x="472" y="226">on the evidence</text>
  </g>
</svg>
